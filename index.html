<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anton | Welcome</title>

  <!-- 🔑 Open Graph tags for Telegram/WhatsApp/Discord previews -->
  <meta property="og:title" content="Anton | Projects & Demos" />
  <meta property="og:description" content="Explore Anton’s demos, music covers, and creative projects hosted on GitHub Pages." />
  <meta property="og:image" content="https://kuantor.github.io/preview.jpg" />
  <meta property="og:url" content="https://kuantor.github.io/" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="style.css">
  <style>
    h2 {
      margin: 10px 0;
      font-weight: 400;
      line-height: 1.6;
    }
    button.button {
      box-sizing: content-box;
      width: 300px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 🎥 Background video -->
  <video autoplay muted loop playsinline poster="background.jpg" id="bg-video">
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- 🎵 Hidden audio player -->
  <audio id="space-audio" src="space.mp3"></audio>

  <header>
    <h1>Anton’s Projects & Demos</h1>
  </header>
  <main>
    <h2>
      Welcome!<br>
      This site is a work in progress, powered by GitHub Pages.<br>
      Feel free to explore the demos and projects I’m sharing here.
    </h2>
    
    <a class="button" href="https://kuantorflow.pythonanywhere.com/">🃏 English Flashcards</a>
    <a class="button" href="https://kuantor.github.io/Billiards/">🎱 Billiard Balls Demo</a>
    <a class="button" href="https://kuantor.github.io/Synthesizer/">🎹 Synthesizer Demo</a>
    <a class="button" href="https://kuantor.github.io/drills/">📝 Drills</a>
    <a class="button" href="https://kuantor-quotes.onrender.com/">📜 Quote of the Day</a>
    <a class="button" href="about.html">👤 About Me</a>
    <button type="button" class="button" id="audio-toggle">🎵 Listen to my 'Space Oddity' cover</button>
    <a class="button" href="https://www.youtube.com/@MrKuant">📺 My YouTube Channel</a>
  </main>
  <footer>
    <p>
      <span style="font-family: Arial, sans-serif;">©</span>
      <span style="font-family: 'Tempus Sans ITC', Arial, sans-serif;"> 2026 Anton</span>
    </p>
  </footer>
  <script>
    var audio = document.getElementById('space-audio');
    var toggle = document.getElementById('audio-toggle');
    var playLabel = "🎵 Listen to my 'Space Oddity' cover";
    var pauseLabel = "⏸ Pause 'Space Oddity'";
    toggle.addEventListener('click', function () {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
    audio.addEventListener('play', function () { toggle.textContent = pauseLabel; });
    audio.addEventListener('pause', function () { toggle.textContent = playLabel; });
    audio.addEventListener('ended', function () { toggle.textContent = playLabel; });
  </script>
</body>
</html>
