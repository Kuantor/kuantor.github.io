<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anton | Welcome</title>
  <style>
    @font-face {
      font-family: "Tempus Sans ITC";
      src: url("TempusITCTT.woff2") format("woff2"),
           url("TempusITCTT.woff") format("woff");
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      font-family: "Tempus Sans ITC", Arial, sans-serif;
      color: #fff;
    }

    /* 🎥 Background video styling */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -1;
    }

    header {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.6em;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00bfff, 0 0 15px #1e90ff;
    }
    main {
      background-color: rgba(0, 0, 0, 0.4);
      padding: 20px;
      text-align: center;
    }
    h2 {
      margin: 10px 0;
      font-weight: 400;
      line-height: 1.6;
    }
    .button {
      display: block;
      margin: 12px auto;
      padding: 12px 24px;
      max-width: 300px;
      background-color: rgba(30, 144, 255, 0.2); /* transparent blue */
      color: #fff;
      border: 2px solid #1e90ff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 1.1em;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
      font-family: "Tempus Sans ITC", Arial, sans-serif;
      text-shadow: 0 0 6px #00bfff, 0 0 12px #1e90ff;
    }
    .button:hover {
      background-color: rgba(30, 144, 255, 0.6);
      transform: scale(1.05);
    }
    footer {
      background-color: rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <!-- 🎥 Background video -->
  <video autoplay muted loop id="bg-video">
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- 🎵 Hidden audio player -->
  <audio id="space-audio" src="space.mp3"></audio>

  <header>
    <h1>Anton’s Projects & Demos</h1>
  </header>
  <main>
    <h2>
      Welcome!<br>
      This site is a work in progress, powered by GitHub Pages.<br>
      Feel free to explore the demos and projects I’m sharing here.
    </h2>
    
    <a class="button" href="https://kuantor.github.io/Billiards/">🎱 Billiard Balls Demo</a>
    <a class="button" href="https://kuantor.github.io/Synthesizer/">🎹 Synthesizer Demo</a>
    <a class="button" href="#" onclick="
      var audio = document.getElementById('space-audio');
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      return false;">
      🎵 Listen to my 'Space Oddity' cover
    </a>
    <a class="button" href="https://www.youtube.com/@MrKuant">📺 My YouTube Channel</a>
  </main>
  <footer>
    <p>
      <span style="font-family: Arial, sans-serif;">©</span>
      <span style="font-family: 'Tempus Sans ITC', Arial, sans-serif;"> 2026 Anton</span>
    </p>
  </footer>
</body>
</html>
